name: Construir APK Android


on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "config.js"
      - "sw.js"
      - "manifest.webmanifest"
      - ".github/workflows/apk.yml"


permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4


      - uses: actions/setup-node@v4
        with:
          node-version: 22


      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21


      - name: Preparar la app web con las librerias incluidas (funciona sin internet)
        run: |
          mkdir -p www/vendor
          cp index.html config.js sw.js manifest.webmanifest icon-192.png icon-512.png icon-maskable-512.png www/
          npm init -y >/dev/null
          npm i leaflet@1.9.4 @supabase/supabase-js@2
          cp node_modules/leaflet/dist/leaflet.js node_modules/leaflet/dist/leaflet.css www/vendor/
          cp -r node_modules/leaflet/dist/images www/vendor/images
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/vendor/

      - name: Publicar APK para descarga directa
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Incendios-Caldas.apk
          gh release delete apk-latest --cleanup-tag -y || true
          gh release create apk-latest Incendios-Caldas.apk --title "Incendios Caldas (APK Android)" --notes "Descarga Incendios-Caldas.apk, abrelo en el celular e instala."
